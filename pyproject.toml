[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mochi-desktop"
version = "0.1.0"
description = "A customisable desktop companion and productivity workspace."
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.12.0",
    "Pillow",
    "psutil",
    "mutagen==1.48.1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]